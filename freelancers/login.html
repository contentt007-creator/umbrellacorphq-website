<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freelancer Login | Umbrella Corp HQ</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="css/freelancers.css">
</head>
<body>
<div class="cursor-dot" aria-hidden="true"></div>
<div class="cursor-ring" aria-hidden="true"></div>

<div class="fl-login-screen">
  <div class="fl-login-card">
    <a href="../index.html" class="fl-login-logo">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:40px;height:40px">
        <circle cx="50" cy="50" r="46" stroke="#c1121f" stroke-width="1.5"/>
        <circle cx="50" cy="50" r="32" stroke="#c1121f" stroke-width="1" stroke-dasharray="4 4"/>
        <line x1="4" y1="50" x2="96" y2="50" stroke="#c1121f" stroke-width="1"/>
        <line x1="50" y1="4" x2="50" y2="96" stroke="#c1121f" stroke-width="1"/>
        <circle cx="50" cy="50" r="6" fill="#c1121f"/>
        <circle cx="50" cy="50" r="2.5" fill="#0a0a0a"/>
      </svg>
      <span>Umbrella Corp HQ</span>
    </a>
    <h1 class="fl-login-heading">Freelancer Portal</h1>
    <p class="fl-login-sub">Sign in to view your jobs and dashboard.</p>

    <!-- Google Sign-in -->
    <button type="button" id="btn-google-login" style="
      display:flex;align-items:center;justify-content:center;gap:12px;
      width:100%;padding:13px 20px;background:#fff;color:#1a1a1a;
      border:none;border-radius:4px;font-family:var(--font-body);
      font-size:14px;font-weight:500;cursor:pointer;margin-bottom:20px;
      transition:opacity 0.2s ease;
    ">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.08 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.36-8.16 2.36-6.26 0-11.57-3.59-13.46-8.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg>
      Continue with Google
    </button>

    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
      <div style="flex:1;height:1px;background:#222"></div>
      <span style="font-size:11px;color:var(--steel);letter-spacing:0.08em">OR</span>
      <div style="flex:1;height:1px;background:#222"></div>
    </div>

    <form id="fl-login-form" novalidate>
      <div class="fl-field">
        <label for="fl-email">Email Address</label>
        <input type="email" id="fl-email" class="fl-input" placeholder="you@email.com" required autocomplete="email">
      </div>
      <div class="fl-field">
        <label for="fl-password">Password</label>
        <input type="password" id="fl-password" class="fl-input" placeholder="Your password" required autocomplete="current-password">
      </div>
      <div id="fl-login-error" class="fl-error-msg" style="display:none"></div>
      <button type="submit" class="fl-login-btn" id="fl-login-btn">
        <span id="fl-login-btn-text">Sign In &rarr;</span>
        <span id="fl-login-spinner" style="display:none">Signing in&hellip;</span>
      </button>
    </form>

    <div class="fl-login-links">
      <p>Forgot password? Email us at <a href="mailto:hello@umbrellacorphq.com">hello@umbrellacorphq.com</a></p>
      <p>Not registered? <a href="register.html">Apply here &rarr;</a></p>
    </div>
  </div>
</div>

<script src="../js/cursor.js"></script>
<script type="module" src="js/login.js"></script>
</body>
</html>
