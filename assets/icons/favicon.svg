<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Outer circle -->
  <circle cx="50" cy="50" r="46" stroke="#c1121f" stroke-width="1.5" fill="none"/>
  <!-- Inner dashed circle -->
  <circle cx="50" cy="50" r="32" stroke="#c1121f" stroke-width="1" fill="none" stroke-dasharray="4 4"/>
  <!-- Horizontal crosshair line -->
  <line x1="4" y1="50" x2="96" y2="50" stroke="#c1121f" stroke-width="1"/>
  <!-- Vertical crosshair line -->
  <line x1="50" y1="4" x2="50" y2="96" stroke="#c1121f" stroke-width="1"/>
  <!-- Diagonal TL to BR -->
  <line x1="15" y1="15" x2="85" y2="85" stroke="#c1121f" stroke-width="0.8" opacity="0.35"/>
  <!-- Diagonal TR to BL -->
  <line x1="85" y1="15" x2="15" y2="85" stroke="#c1121f" stroke-width="0.8" opacity="0.35"/>
  <!-- Center dot -->
  <circle cx="50" cy="50" r="6" fill="#c1121f"/>
  <!-- Center void cutout -->
  <circle cx="50" cy="50" r="2.5" fill="#0a0a0a"/>
</svg>
